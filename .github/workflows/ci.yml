name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same PR/branch cancel older, still-running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied via clippy's own flag rather than RUSTFLAGS, so a noisy
  # dependency can't fail our build.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The factory's tests deploy the real payroll wasm, so build it first.
      - run: cargo build --locked -p disburs-payroll -p disburs-factory --target wasm32v1-none --release
      # --locked fails if Cargo.lock is stale, which keeps the committed lock
      # file (deliberately pinned, see CONTEXT.md) honest.
      - run: cargo test --locked --all-targets

  build:
    name: Build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-stellar-cli

      - name: Build
        run: stellar contract build --meta source_repo=github:${{ github.repository }}

      - name: Optimize, checksum, and inspect
        id: wasm
        run: |
          set -euo pipefail
          mkdir -p dist
          for wasm in target/wasm32v1-none/release/*.wasm; do
            name="$(basename "$wasm" .wasm)"
            stellar contract optimize --wasm "$wasm"
            cp "target/wasm32v1-none/release/${name}.optimized.wasm" "dist/${name}.wasm"
            stellar contract info interface --wasm "dist/${name}.wasm" > "dist/${name}.interface.txt"
            stellar contract info meta --wasm "dist/${name}.wasm" > "dist/${name}.meta.txt"
          done
          (cd dist && sha256sum ./*.wasm > SHA256SUMS)

      - name: Summary
        run: |
          {
            echo '### Contract build'
            echo
            echo '| artifact | bytes |'
            echo '| --- | ---: |'
            for wasm in dist/*.wasm; do
              echo "| \`$(basename "$wasm")\` | $(wc -c < "$wasm") |"
            done
            echo
            echo '#### sha256'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo '#### Interface'
            echo '```'
            cat dist/*.interface.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: contract-wasm-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities and yanked crates. Deliberately not
      # `--deny warnings`: the lock file is pinned on purpose (see docs/ci-cd.md)
      # and an "unmaintained" notice deep in the soroban tree shouldn't block a
      # contract PR. `security.yml` reports those weekly.
      - run: cargo audit --deny yanked

  # Single job to point branch protection's "required status checks" at, so
  # adding or renaming a job above doesn't mean editing repo settings.
  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, test, build, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
